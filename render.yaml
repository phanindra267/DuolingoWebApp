services:
  - type: web
    name: duolingo-clone-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./database.db
    # Note: Render persistent disks require a paid plan (e.g. Starter).
    # For free tier, SQLite runs in local directory and auto-seeds on restart.

  - type: web
    name: duolingo-clone-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://duolingo-clone-backend-kyf3.onrender.com
      - key: PORT
        value: 3000


