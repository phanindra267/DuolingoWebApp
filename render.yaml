services:
  - type: web
    name: duolingo-clone-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./database.db
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src
      sizeGB: 1
